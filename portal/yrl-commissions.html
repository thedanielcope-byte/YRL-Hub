<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Commissions — Your Realty Link</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="portal-auth.js"></script>
    <script src="embed-mode.js?v=20260927b"></script>
    <script src="help-box.js?v=20260918a" defer></script>
    <script src="commission-calc.js?v=20260923a"></script>
    <style>
        :root{
            --red:#c03926; --red-light:#d94a35; --red-dark:#9e2e1e;
            --bg:#f2f4f7; --surface:#ffffff; --surface-2:#f7f8fa; --surface-3:#eef0f3;
            --border:#e2e5ea; --text:#1a1d22; --text-sec:#5a6270; --text-muted:#9ca3af; --green:#16a34a;
            --radius:14px;
        }
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);line-height:1.6;}
        a{text-decoration:none;color:inherit;}
        .page-header{background:linear-gradient(150deg,#a82f1e 0%,#c03926 45%,#9e2e1e 100%);padding:26px 22px;}
        .header-inner{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
        .header-left{display:flex;align-items:center;gap:16px;}
        .back-btn{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.3);color:#fff;padding:9px 16px;border-radius:100px;font-size:13px;font-weight:600;white-space:nowrap;}
        .header-title h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(26px,4vw,38px);letter-spacing:1.5px;color:#fff;line-height:1.1;}
        .header-title p{font-size:13px;color:rgba(255,255,255,0.85);}
        .wrap{max-width:1000px;margin:0 auto;padding:26px 22px 90px;}

        .mc-picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px dashed var(--border);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--text-sec);}
        .mc-picker select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font:inherit;font-size:13.5px;min-width:220px;max-width:100%;}

        .mc-plan{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
        .mc-plan-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;}
        .mc-split{font-family:'Bebas Neue',sans-serif;font-size:40px;line-height:1;letter-spacing:1px;}
        .mc-split small{font-family:'Inter';font-size:12px;letter-spacing:0;color:var(--text-muted);font-weight:600;margin-left:6px;}
        .mc-facts{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--text-sec);margin-top:8px;}
        .mc-facts b{color:var(--text);}
        .mc-cap{flex:1;min-width:240px;max-width:420px;}
        .mc-cap-lbl{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--text-sec);margin-bottom:5px;gap:10px;}
        .mc-bar{height:12px;border-radius:99px;background:var(--surface-3);overflow:hidden;}
        .mc-bar > span{display:block;height:100%;background:linear-gradient(90deg,#d94a35,#c03926);border-radius:99px;transition:width .5s ease;}
        .mc-bar.full > span{background:linear-gradient(90deg,#22c55e,#16a34a);}
        .mc-cap-sub{font-size:11.5px;color:var(--text-muted);margin-top:4px;}

        .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:6px;}
        @media(max-width:760px){.kpis{grid-template-columns:repeat(2,1fr);}}
        .kpi{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;}
        .kpi .lbl{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);}
        .kpi .val{font-family:'Bebas Neue',sans-serif;font-size:28px;line-height:1.05;letter-spacing:.5px;margin-top:3px;word-break:break-word;}
        .kpi .sub{font-size:11px;color:var(--text-muted);}
        .kpi.net .val{color:#15803d;}
        .mc-toggle{display:inline-flex;background:var(--surface-3);border-radius:9px;padding:3px;margin:6px 0 12px;}
        .mc-toggle button{border:none;background:none;padding:6px 12px;border-radius:7px;font:inherit;font-size:12px;font-weight:700;color:var(--text-sec);cursor:pointer;}
        .mc-toggle button.on{background:var(--surface);color:var(--red);box-shadow:0 1px 3px rgba(0,0,0,.08);}

        .sec-title{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:1px;margin:18px 0 10px;display:flex;align-items:center;gap:10px;}
        .sec-title .cnt{font-family:'Inter';font-size:11px;font-weight:800;background:var(--surface-3);color:var(--text-sec);border-radius:99px;padding:2px 9px;letter-spacing:0;}
        .deal{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:9px;overflow:hidden;}
        .deal-h{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;background:none;border:none;cursor:pointer;font:inherit;text-align:left;color:inherit;}
        .deal-h:hover{background:var(--surface-2);}
        .deal-ic{width:38px;height:38px;border-radius:10px;background:rgba(192,57,38,.1);color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
        .deal.est .deal-ic{background:rgba(234,179,8,.14);color:#a16207;}
        .deal-main{flex:1;min-width:0;}
        .deal-t{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .deal-s{font-size:12px;color:var(--text-muted);}
        .deal-amt{text-align:right;flex-shrink:0;}
        .deal-amt b{display:block;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.5px;color:#15803d;line-height:1.1;}
        .deal-amt small{font-size:10.5px;color:var(--text-muted);font-weight:600;}
        .deal-chev{color:var(--text-muted);transition:transform .2s;flex-shrink:0;}
        .deal.open .deal-chev{transform:rotate(180deg);}
        .deal-b{display:none;padding:4px 16px 16px 66px;}
        .deal.open .deal-b{display:block;}
        @media(max-width:560px){.deal-b{padding:4px 14px 14px;}.deal-ic{display:none;}}
        .lines{width:100%;border-collapse:collapse;font-size:13px;max-width:520px;}
        .lines td{padding:6px 2px;border-bottom:1px dashed var(--border);}
        .lines td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
        .lines tr.sub td{font-weight:700;border-bottom-style:solid;}
        .lines tr.tot td{font-weight:800;font-size:14.5px;color:#15803d;border-bottom:none;}
        .lines tr.info td{color:var(--text-muted);font-style:italic;}
        .adj{font-size:9.5px;font-weight:800;color:#a16207;background:rgba(234,179,8,.16);padding:1px 6px;border-radius:4px;margin-left:6px;}
        .pill{display:inline-block;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 8px;border-radius:20px;background:var(--surface-3);color:var(--text-sec);}
        .pill.ok{background:rgba(22,163,74,.12);color:#15803d;}
        .pill.wait{background:rgba(234,179,8,.16);color:#a16207;}
        .deal-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}
        .btn-sm{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--red);border:1.5px solid var(--border);border-radius:8px;padding:6px 11px;background:var(--surface);cursor:pointer;font-family:inherit;}
        .btn-sm:hover{border-color:var(--red);}
        .note{font-size:12.5px;color:var(--text-sec);background:var(--surface-3);border-radius:9px;padding:9px 13px;margin:10px 0 4px;}
        .empty{text-align:center;padding:36px 20px;color:var(--text-muted);background:var(--surface);border:1px dashed var(--border);border-radius:12px;font-size:13.5px;}
        .empty i{font-size:32px;opacity:.3;display:block;margin-bottom:10px;}
        .err{color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:12px 14px;font-size:13px;}
    </style>
<link rel="stylesheet" href="hub-theme.css?v=20260903b"><script src="hub-brand.js" defer></script></head>
<body>

<header class="page-header">
    <div class="header-inner">
        <div class="header-left">
            <a href="hub.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
            <div class="header-title">
                <h1><i class="fa-solid fa-sack-dollar" style="font-size:0.8em;opacity:.9;"></i> My Commissions</h1>
                <p>Your split, cap progress, and every deal's breakdown</p>
            </div>
        </div>
    </div>
</header>

<div class="wrap">
    <div id="helpTop"></div>
    <script>document.addEventListener("DOMContentLoaded",function(){ window.HelpBox && HelpBox.mount({container:"#helpTop",key:"yrl-commissions",label:"My Commissions"}); });</script>
    <div id="mcPicker"></div>
    <div id="mcView"><div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Loading your commissions…</div></div>
</div>

<script>
(function(){
    const CC = window.CommissionCalc;
    const CLIENT = 'cf007287-a76c-4c9a-bd33-051816db6322';
    let SB, ME, MY_EMAIL, IS_ADMIN, VIEW_EMAIL, booted = false;
    let CTX = null, RECORDS = [], PENDING = [], CDA = {}, PERIOD = 'cap';
    let ALIAS = {};   // alias login → primary agent (e.g. CSI Realty Team → Daniel Cope)
    const primary = (e) => ALIAS[lc(e)] || lc(e);
    const loginsOf = (e) => [lc(e)].concat(Object.keys(ALIAS).filter(a => ALIAS[a] === lc(e)));
    const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const m$ = (v) => CC.money(v || 0);
    const k$ = (v) => {
        v = Number(v) || 0; const a = Math.abs(v);
        if (a >= 1e6) return '$' + (v / 1e6).toFixed(2).replace(/\.?0+$/, '') + 'M';
        if (a >= 1e5) return '$' + Math.round(v / 1000) + 'K';
        return m$(v).replace(/\.\d\d$/, '');
    };
    const lc = (e) => String(e || '').trim().toLowerCase();
    const fmtD = (d) => d ? new Date(String(d).slice(0,10) + 'T12:00:00').toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }) : '—';
    const today = () => new Date().toISOString().slice(0, 10);

    async function boot(){
        if (booted || !window.yrlMember || !window.yrlClient) return; booted = true;
        SB = window.yrlClient; ME = window.yrlMember;
        MY_EMAIL = lc((window.yrlUser && window.yrlUser.email) || ME.email);
        IS_ADMIN = ME.role === 'owner' || ME.role === 'nomad_admin';
        try {
            const { data } = await SB.from('commission_email_aliases').select('alias_email,primary_email');
            (data || []).forEach(x => { ALIAS[lc(x.alias_email)] = lc(x.primary_email); });
        } catch (_) { /* no aliases → each login is its own agent */ }
        VIEW_EMAIL = primary(MY_EMAIL);
        if (IS_ADMIN) await renderPicker();
        load();
    }

    async function renderPicker(){
        const { data } = await SB.from('hub_authorized_agents').select('email,name').eq('client_id', CLIENT).eq('status','active');
        const agents = (data || []).filter(a => !ALIAS[lc(a.email)])
            .map(a => ({ email: lc(a.email), name: (a.name || '').trim() || lc(a.email).split('@')[0] })).sort((a,b) => a.name.localeCompare(b.name));
        if (!agents.some(a => a.email === VIEW_EMAIL)) agents.unshift({ email: VIEW_EMAIL, name: 'Me' });
        document.getElementById('mcPicker').innerHTML = `<div class="mc-picker"><i class="fa-solid fa-user-shield"></i> Broker view — showing
            <select onchange="__mcView(this.value)">${agents.map(a => `<option value="${esc(a.email)}"${a.email === VIEW_EMAIL ? ' selected' : ''}>${esc(a.name)}</option>`).join('')}</select>
            <a href="https://portal.yrlagent.com/admin.html#commissions" target="_blank" rel="noopener" style="margin-left:auto;font-weight:700;color:var(--red)">Edit plans &amp; reports →</a></div>`;
    }
    window.__mcView = function(email){ VIEW_EMAIL = lc(email); load(); };

    async function load(){
        const view = document.getElementById('mcView');
        view.innerHTML = '<div class="empty"><i class="fa-solid fa-spinner fa-spin"></i>Loading…</div>';
        try {
            let rq = SB.from('commission_records').select('*').eq('status','final').order('closing_date', { ascending:false });
            let pq = SB.from('closing_requests').select('id,status,closing_date,property_address,property_zip,side,sales_price,total_commission,earnest_amount,referral_payee,referral_pct,referral_amount,cda_pdf_url,agent_email');
            if (IS_ADMIN) { rq = rq.eq('agent_email', VIEW_EMAIL); pq = pq.in('agent_email', loginsOf(VIEW_EMAIL)); }
            const [c, r, p] = await Promise.all([
                SB.rpc('commission_context', { p_agent_email: VIEW_EMAIL, p_closing_date: today(), p_exclude_closing_id: null }),
                rq, pq
            ]);
            if (c.error) throw c.error; if (r.error) throw r.error; if (p.error) throw p.error;
            CTX = c.data; RECORDS = r.data || [];
            const all = p.data || [];
            CDA = {}; all.forEach(x => { CDA[x.id] = x.cda_pdf_url; });
            const finalized = new Set(RECORDS.map(x => x.closing_request_id));
            PENDING = all.filter(x => (x.status === 'submitted' || x.status === 'in_review') && !finalized.has(x.id));
            render();
        } catch(e) {
            view.innerHTML = '<div class="err"><b>Couldn’t load commissions.</b> ' + esc(e.message || e) + '</div>';
        }
    }

    function render(){
        const eff = CC.effectivePlan(CTX.settings, CTX.plan);
        const cap = eff.annual_cap, paid = Number(CTX.company_paid) || 0;
        const pct = cap ? Math.min(100, Math.round(paid / cap * 100)) : 0;
        const capped = cap != null && paid >= cap;
        const capBlock = cap == null
            ? `<div class="mc-cap"><div class="mc-cap-lbl"><span>No annual cap</span></div><div class="mc-cap-sub">Company split applies to every deal.</div></div>`
            : `<div class="mc-cap">
                <div class="mc-cap-lbl"><span>${capped ? '<i class="fa-solid fa-trophy" style="color:#16a34a"></i> Capped!' : 'Cap progress'}</span><span>${m$(paid)} / ${m$(cap)}</span></div>
                <div class="mc-bar${capped ? ' full' : ''}"><span style="width:${pct}%"></span></div>
                <div class="mc-cap-sub">${capped ? 'You keep ' + eff.post_cap_split_pct + '% for the rest of the cap year' : m$(Math.max(0, cap - paid)) + ' to go'} · ${esc(CC.capYearLabel(CTX.cap_year_start, CTX.cap_year_end))}</div>
              </div>`;
        const mentorLeft = eff.mentor_pct ? (eff.mentor_deals_total != null ? Math.max(0, eff.mentor_deals_total - (CTX.mentor_deals_used || 0)) + ' of ' + eff.mentor_deals_total + ' deals left' : 'every deal') : '';

        // KPIs for the chosen period
        const inPeriod = (d) => {
            d = String(d || '').slice(0, 10);
            if (PERIOD === 'cap') return d >= CTX.cap_year_start && d <= CTX.cap_year_end;
            return d.slice(0, 4) === today().slice(0, 4);
        };
        const rs = RECORDS.filter(r => inPeriod(r.closing_date));
        const sum = (k) => rs.reduce((s, r) => s + (Number(r[k]) || 0), 0);
        const fees = sum('txn_fee') + sum('mentor_fee') + sum('referral_amount') + sum('company_dollar');

        const est = PENDING.map(p => ({ p, r: CC.calc(eff, CTX, { gross: p.total_commission, referral_pct: p.referral_pct, referral_amount: p.referral_amount, referral_payee: p.referral_payee, earnest_held: p.earnest_amount, agent_name: CTX.agent_name }) }));

        document.getElementById('mcView').innerHTML = `
            <div class="mc-plan">
                <div class="mc-plan-top">
                    <div>
                        <div class="mc-split">${eff.split_pct_agent}/${100 - eff.split_pct_agent}<small>${eff.has_custom_plan ? 'your split' : 'company standard split'}</small></div>
                        <div class="mc-facts">
                            <span>Txn fee <b>${m$(eff.txn_fee)}</b>${eff.txn_fee_payer === 'client' ? ' (paid by client)' : ''}</span>
                            ${cap != null && eff.post_cap_txn_fee !== eff.txn_fee ? `<span>Post-cap fee <b>${m$(eff.post_cap_txn_fee)}</b></span>` : ''}
                            ${eff.mentor_pct ? `<span>Mentor <b>${esc(eff.mentor_name || '')} ${eff.mentor_pct}%</b> · ${mentorLeft}</span>` : ''}
                            ${eff.payable_to ? `<span>Paid to <b>${esc(eff.payable_to)}</b></span>` : ''}
                        </div>
                    </div>
                    ${capBlock}
                </div>
            </div>

            <div class="mc-toggle">
                <button class="${PERIOD === 'cap' ? 'on' : ''}" onclick="__mcPeriod('cap')">This cap year</button>
                <button class="${PERIOD === 'cal' ? 'on' : ''}" onclick="__mcPeriod('cal')">Calendar ${today().slice(0,4)}</button>
            </div>
            <div class="kpis">
                <div class="kpi"><div class="lbl">Closed deals</div><div class="val">${rs.length}</div><div class="sub">${k$(sum('sales_price'))} volume</div></div>
                <div class="kpi"><div class="lbl">GCI</div><div class="val">${k$(sum('gross'))}</div><div class="sub">gross commission</div></div>
                <div class="kpi"><div class="lbl">Splits &amp; fees</div><div class="val">${k$(fees)}</div><div class="sub">company, fees, referrals, mentor</div></div>
                <div class="kpi net"><div class="lbl">Net income</div><div class="val">${k$(sum('agent_net'))}</div><div class="sub">paid to you</div></div>
            </div>

            ${est.length ? `<div class="sec-title">Pending — estimated <span class="cnt">${est.length}</span></div>
                <div class="note"><i class="fa-solid fa-circle-info"></i> Estimates use your plan and today's cap progress. The final numbers are set when the broker completes your CDA.</div>
                ${est.map(({p, r}) => dealCard('p-' + p.id, true, p.property_address, 'Closing ' + fmtD(p.closing_date) + ' · ' + (p.status === 'in_review' ? 'In review' : 'Submitted'), r, null)).join('')}` : ''}

            <div class="sec-title">Closed deals <span class="cnt">${RECORDS.length}</span></div>
            ${RECORDS.length ? RECORDS.map(r => dealCard(r.id, false, r.property_address, 'Closed ' + fmtD(r.closing_date) + ' · ' + (r.side === 'buyer' ? 'Buyer side' : r.side === 'both' ? 'Both sides' : 'Listing side'), r.calc, r)).join('')
              : `<div class="empty"><i class="fa-solid fa-sack-dollar"></i>No finalized deals yet. Once the broker completes the CDA on your <a href="yrl-closing-request.html" style="color:var(--red);font-weight:700">Commission Distribution Form</a>, the full breakdown shows up here.</div>`}
        `;
    }
    window.__mcPeriod = function(p){ PERIOD = p; render(); };

    function linesHtml(calc){
        if (!calc || !calc.lines) return '<div class="deal-s">No breakdown recorded.</div>';
        return '<table class="lines">' + calc.lines.map(l => `<tr class="${l.total ? 'tot' : l.subtotal ? 'sub' : l.info ? 'info' : ''}"><td>${esc(l.label)}${l.overridden ? '<span class="adj">ADJUSTED</span>' : ''}</td><td class="n">${l.info ? m$(l.feeAmount) : m$(l.amount)}</td></tr>`).join('') + '</table>';
    }
    function dealCard(id, estimated, addr, sub, calc, rec){
        const net = calc ? calc.agent_net : (rec ? rec.agent_net : 0);
        let status = '';
        if (rec) status = rec.paid_to_agent_at ? `<span class="pill ok">Paid ${esc(fmtD(rec.paid_to_agent_at))}</span>` : '<span class="pill wait">Awaiting payout</span>';
        const cda = rec && CDA[rec.closing_request_id];
        return `<div class="deal${estimated ? ' est' : ''}" id="deal-${esc(id)}">
            <button class="deal-h" onclick="this.parentElement.classList.toggle('open')">
                <span class="deal-ic"><i class="fa-solid ${estimated ? 'fa-hourglass-half' : 'fa-house-circle-check'}"></i></span>
                <span class="deal-main"><div class="deal-t">${esc(addr || 'Property')}</div><div class="deal-s">${esc(sub)} ${status}</div></span>
                <span class="deal-amt"><b>${m$(net)}</b><small>${estimated ? 'est. net' : 'net to you'}</small></span>
                <i class="fa-solid fa-chevron-down deal-chev"></i>
            </button>
            <div class="deal-b">
                ${linesHtml(calc)}
                ${calc && calc.warnings && calc.warnings.length ? calc.warnings.map(w => `<div class="note">${esc(w)}</div>`).join('') : ''}
                ${!estimated ? `<div class="deal-acts">
                    ${cda ? `<a class="btn-sm" href="${esc(cda)}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> CDA</a>` : ''}
                    <button class="btn-sm" onclick="__mcPrint('${esc(id)}')"><i class="fa-solid fa-print"></i> Print statement</button>
                </div>` : ''}
            </div>
        </div>`;
    }

    window.__mcPrint = function(id){
        const r = RECORDS.find(x => x.id === id); if (!r) return;
        const w = window.open('', '_blank', 'width=720,height=900'); if (!w) { alert('Allow pop-ups to print the statement.'); return; }
        const calc = r.calc || {};
        const rows = (calc.lines || []).map(l => `<tr style="${l.total ? 'font-weight:800;color:#15803d;font-size:15px' : l.subtotal ? 'font-weight:700' : l.info ? 'color:#777;font-style:italic' : ''}"><td style="padding:7px 0;border-bottom:1px dashed #ddd">${esc(l.label)}${l.overridden ? ' (adjusted)' : ''}</td><td style="padding:7px 0;border-bottom:1px dashed #ddd;text-align:right">${l.info ? m$(l.feeAmount) : m$(l.amount)}</td></tr>`).join('');
        w.document.write(`<!DOCTYPE html><html><head><title>Commission Statement — ${esc(r.property_address || '')}</title></head>
            <body style="font-family:Georgia,serif;max-width:620px;margin:36px auto;color:#1a1d22">
            <h2 style="color:#c03926;margin:0 0 4px">Commission Statement</h2>
            <div style="color:#666;font-size:13px;margin-bottom:18px">Your Realty Link · ${esc(CTX.agent_name)}${(r.plan_snapshot && r.plan_snapshot.payable_to) ? ' · paid to ' + esc(r.plan_snapshot.payable_to) : ''}</div>
            <table style="font-size:14px;margin-bottom:18px"><tr><td style="padding-right:18px;color:#666">Property</td><td>${esc(r.property_address || '')}</td></tr>
            <tr><td style="padding-right:18px;color:#666">Client</td><td>${esc(r.client_name || '')}</td></tr>
            <tr><td style="padding-right:18px;color:#666">Closed</td><td>${esc(fmtD(r.closing_date))}</td></tr>
            <tr><td style="padding-right:18px;color:#666">Sales price</td><td>${m$(r.sales_price)}</td></tr></table>
            <table style="width:100%;border-collapse:collapse;font-size:14px">${rows}</table>
            ${calc.cap && calc.cap.cap != null ? `<p style="font-size:12.5px;color:#666;margin-top:18px">Cap year ${esc(CC.capYearLabel(calc.cap.year_start, calc.cap.year_end))}: ${m$(calc.cap.paid_after)} of ${m$(calc.cap.cap)} paid toward cap.</p>` : ''}
            ${r.paid_to_agent_at ? `<p style="font-size:12.5px;color:#666">Paid ${esc(fmtD(r.paid_to_agent_at))}${r.paid_method ? ' by ' + esc(r.paid_method) : ''}${r.paid_ref ? ' (' + esc(r.paid_ref) + ')' : ''}.</p>` : ''}
            <script>setTimeout(function(){window.print();},300);<\/script></body></html>`);
        w.document.close();
    };

    document.addEventListener('yrl-auth-ready', boot);
    if (window.yrlMember) boot();
})();
